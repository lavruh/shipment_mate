name: shipment_mate
description: "App helping to sort spare parts shipments"
publish_to: 'none'

version: 1.0.5+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  path_provider: ^2.1.6
  file_picker: ^12.1.2
  sembast: ^3.8.9+1
  path: ^1.9.1
  excel: ^4.0.6
  mobile_scanner: ^7.4.0
  collection: ^1.19.1
  flutter_slidable: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.8.1
  build_runner: ^2.16.0

flutter:
  uses-material-design: true
